[pytest]
testpaths = tests
pythonpath = src
qt_api = pyside6
; 受限环境下禁用两个会用系统临时目录/重命名的插件：
;   no:tmpdir        —— pytest 在系统临时目录创建 basetemp，收尾扫描会被拒绝
;   no:cacheprovider —— .pytest_cache 的重命名写入会被拒绝
; 需要临时目录的用例改用 conftest.py 的 work_dir 夹具（工作区内）。
addopts = -q --strict-markers -p no:cacheprovider -p no:tmpdir
filterwarnings =
    error::DeprecationWarning:zpyaudio.*
